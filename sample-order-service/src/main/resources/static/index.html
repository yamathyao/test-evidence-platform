<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Workbench</title>
    <link rel="stylesheet" href="/order-console.css">
</head>
<body>
<main class="workbench">
    <header class="masthead">
        <p class="eyebrow">SAMPLE ORDER SERVICE</p>
        <h1>订单工作台</h1>
        <p class="run-note">使用 Platform Run 中配置的订单号提交订单</p>
    </header>

    <section class="work-grid" aria-label="订单履约工作区">
        <form id="order-form" class="order-form">
            <div class="section-heading">
                <span>01</span>
                <h2>创建订单</h2>
            </div>

            <label for="order-no">订单号</label>
            <input id="order-no" name="orderNo" maxlength="128" required autocomplete="off"
                   placeholder="例如 RUN-20260819-001">

            <label for="sku">商品</label>
            <select id="sku" name="sku">
                <option value="SKU-COFFEE">冷萃咖啡</option>
                <option value="SKU-TEA">桂花乌龙</option>
                <option value="SKU-COOKIE">黄油曲奇</option>
            </select>

            <label for="quantity">数量</label>
            <input id="quantity" name="quantity" type="number" min="1" max="99" value="1" required>

            <label for="note">备注 <span>可选</span></label>
            <textarea id="note" name="note" maxlength="256" rows="3" placeholder="例如：用于黑盒验收"></textarea>

            <button id="submit-order" type="submit">
                <span>提交订单</span>
                <span aria-hidden="true">&#8594;</span>
            </button>
        </form>

        <section class="order-status" aria-live="polite" aria-labelledby="status-title">
            <div class="section-heading">
                <span>02</span>
                <h2 id="status-title">履约状态</h2>
            </div>
            <p id="status-badge" class="status-badge" data-state="idle">等待订单</p>
            <dl>
                <div><dt>订单号</dt><dd id="status-order-no">--</dd></div>
                <div><dt>商品</dt><dd id="status-sku">--</dd></div>
                <div><dt>数量</dt><dd id="status-quantity">--</dd></div>
                <div><dt>完成时间</dt><dd id="status-time">--</dd></div>
            </dl>
            <p id="status-message" class="status-message">提交后会显示履约结果。</p>
        </section>
    </section>
</main>
<script src="/order-console.js"></script>
</body>
</html>
